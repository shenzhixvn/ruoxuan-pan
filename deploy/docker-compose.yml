services:
  db:
    image: mysql:5.6
    container_name: pan-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: cs
      MYSQL_USER: cs
      MYSQL_PASSWORD: "123456"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d:ro
      - pan-db-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3317:3306"

  web:
    build: .
    image: pan-web:php70
    container_name: pan-web
    restart: unless-stopped
    depends_on:
      - db
    volumes:
      - ./html:/var/www/html
    ports:
      - "8088:80"

volumes:
  pan-db-data:
