# pan.x6m.top —— 网盘系统 nginx 配置（2026-10-21）
# 80：ACME 校验 + 跳 HTTPS；443：Vue3 前端（/app/）+ 反代 PHP 后端（8088）

server {
    listen 80;
    server_name pan.x6m.top;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name pan.x6m.top;

    ssl_certificate     /etc/letsencrypt/live/pan.x6m.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pan.x6m.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 200m;

    # 首页直接进 Vue 演示端（旧 PHP 主界面太粗糙，只在 /dome、/pan 等路径保留）
    location = / { return 302 /app/; }

    # /app 不带斜杠时补跳转（否则落到 location / 反代后 404）
    location = /app { return 301 /app/; }

    # Vue3 前端（Vite 产物，base=/app/）
    location ^~ /app/ {
        alias /var/www/pan-vue/;
        index index.html;
        try_files $uri $uri/ /app/index.html;
    }

    # 后端 API + 原 PHP 页面
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
